[package]
name = "fralsare-daily"
version = "0.1.0"
description = "A minimal cross-platform desktop news reader organized by topics"
authors = ["fralsare"]
edition = "2021"
license = "MIT"

[lib]
name = "fralsare_daily_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.37"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures = "0.3"
regex = "1"
url = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
